# Trusted publisher on npmjs.com for @singlefax/n8n-nodes-singlefax (filename must match exactly):
#   Organization or user: SingleFax
#   Repository: n8n-nodes-singlefax
#   Workflow filename: publish.yml
#   Environment name: (leave empty)
#   Allowed actions: npm publish
# The package must already exist before that form can be saved. Provenance is automatic.
# Docs: https://docs.npmjs.com/trusted-publishers

name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
